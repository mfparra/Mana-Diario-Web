[project]
name = "mana-diario"
version = "0.1.0"
description = "Maná Diário: um pequeno estudo bíblico por dia."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "pyyaml",
    "python-dateutil",
]

[project.scripts]
mana = "mana.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mana"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
